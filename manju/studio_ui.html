<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manju Studio · 输入层管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%232f5d8a'/%3E%3Ctext x='12' y='17' font-size='14' fill='%23f2f6fa' text-anchor='middle' font-family='sans-serif'%3EMS%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f7fa; --surface:#fff; --ink:#17202a; --muted:#667085;
  --line:#e3e8ef; --line2:#eef2f6; --chip:#eef2f6;
  --accent:#2f5d8a; --accent-ink:#24486b; --accent-soft:#eaf1f8;
  --ok:#0f766e; --ok-soft:#e8f5f1; --ok-line:#bfe3d8;
  --warn:#b45309; --warn-soft:#fff7ea; --warn-line:#f0d7ac;
  --danger:#b42318; --danger-soft:#fef3f2; --danger-line:#f3c6c2;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --radius:12px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
code,pre{font-family:ui-monospace,Consolas,"SFMono-Regular",Menlo,monospace}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30; min-height:58px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px 18px; background:rgba(245,247,250,.96);
  border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.brand{display:flex; align-items:baseline; gap:8px}
.brand h1{font-size:16px; margin:0; letter-spacing:.2px}
.brand .sub{font-size:12px; color:var(--muted)}
.hdr-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.hdr-right .selwrap{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
.hdr-right select{width:auto; min-width:150px; padding:6px 8px}
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:12px;
  padding:3px 9px; border-radius:999px; background:var(--chip); color:var(--muted);
  white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis;
}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.err{background:var(--danger-soft); color:var(--danger)}

/* ---------- layout ---------- */
.layout{display:grid; grid-template-columns:216px minmax(0,1fr); min-height:calc(100vh - 58px)}
nav{
  position:sticky; top:58px; align-self:start; height:calc(100vh - 58px);
  overflow:auto; padding:14px 10px 22px; background:#eef2f7;
  border-right:1px solid var(--line);
}
.navsec{font-size:11px; color:var(--muted); letter-spacing:.6px; padding:10px 10px 4px; text-transform:uppercase}
nav button{
  position:relative; display:flex; align-items:center; gap:9px; width:100%;
  border:0; background:transparent; color:var(--ink); text-align:left;
  padding:9px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-family:inherit;
}
nav button:hover{background:#e3e9f1}
nav button.active{background:var(--accent); color:#fff}
nav button .step{
  width:19px; height:19px; flex:0 0 19px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; background:#dde5ee; color:var(--accent-ink);
}
nav button.active .step{background:rgba(255,255,255,.2); color:#fff}
nav button .navdot{
  width:7px; height:7px; border-radius:50%; background:var(--warn); margin-left:auto;
}
main{
  width:100%; max-width:1120px; margin:0 auto;
  padding:24px 28px 96px; min-width:0;
}
body.has-publish main{padding-bottom:140px}

/* ---------- generic ---------- */
.pagehead{margin:0 0 18px}
.pagehead h2{font-size:19px; margin:0 0 4px; letter-spacing:.2px}
.pagehead .help{max-width:760px}
.help{font-size:12.5px; color:var(--muted); margin:4px 0 0}
.muted{color:var(--muted); font-size:12.5px}
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:16px; box-shadow:var(--shadow);
}
.panel h3{font-size:14px; margin:0 0 3px}
.panel .panel-sub{
  margin:18px 0 0; padding-top:16px; border-top:1px solid var(--line2);
}
.panel .panel-sub h4{font-size:13px; margin:0 0 2px}
.grid2,.grid3{display:grid; gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.field label{display:block; font-size:12.5px; color:var(--muted); margin:10px 0 4px}
.field label:first-child{margin-top:0}
input,select,textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  font-size:13px; font-family:inherit; background:#fff; color:var(--ink);
}
input[type=checkbox]{width:auto; margin:0}
textarea{min-height:76px; resize:vertical; line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px}
.actions.tight{margin-top:10px}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:inherit;
}
.btn:hover:not(:disabled){background:var(--accent-ink); border-color:var(--accent-ink)}
.btn.ghost{background:#fff; color:var(--accent)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft)}
.btn.danger{background:var(--danger); border-color:var(--danger)}
.btn.sm{padding:5px 10px; font-size:12px}
.btn:disabled{opacity:.55; cursor:not-allowed}
.linkbtn{border:0; background:none; color:var(--accent); cursor:pointer; font:inherit; padding:0}
.linkbtn:hover{text-decoration:underline}
.check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink)}
.adv{margin-top:16px; border-top:1px dashed var(--line); padding-top:12px}
.adv summary{cursor:pointer; font-size:13px; color:var(--accent); width:max-content}
.adv[open] summary{margin-bottom:8px}

/* ---------- status / callout / empty ---------- */
.statusline{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:11px 14px; margin-bottom:12px;
}
.statusline.ok{background:var(--ok-soft); border-color:var(--ok-line)}
.statusline.warn{background:var(--warn-soft); border-color:var(--warn-line)}
.statusline.err{background:var(--danger-soft); border-color:var(--danger-line)}
.statusline b{font-size:13px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; flex:0 0 9px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--danger)}
.dot.run{background:var(--warn); animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.callout{
  border-left:3px solid var(--accent); background:var(--accent-soft);
  padding:10px 13px; border-radius:0 8px 8px 0; font-size:13px; margin:16px 0;
}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout.err{border-left-color:var(--danger); background:var(--danger-soft)}
.empty{
  text-align:center; padding:44px 24px; border:1px dashed var(--line);
  border-radius:12px; background:var(--surface); color:var(--muted);
}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}

/* ---------- episode cards ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.epcard{
  border:1px solid var(--line); border-radius:11px; background:var(--surface);
  padding:14px; cursor:pointer; box-shadow:var(--shadow); transition:.15s;
}
.epcard:hover{border-color:var(--accent); transform:translateY(-1px)}
.epcard .num{font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.5px}
.epcard .title{font-weight:650; margin:3px 0 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.epcard .meta{font-size:12px; color:var(--muted)}

/* ---------- shots ---------- */
.scene{margin:0 0 18px}
.scenehead{display:flex; align-items:baseline; gap:10px; margin:0 0 8px}
.scenehead h3{font-size:13.5px; margin:0}
.shot{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  margin-bottom:8px; box-shadow:var(--shadow); overflow:hidden;
}
.shot summary{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 12px; cursor:pointer; list-style:none;
}
.shot summary::-webkit-details-marker{display:none}
.shot summary:hover{background:#f8fafc}
.shot[open] summary{background:#f8fafc; border-bottom:1px solid var(--line2)}
.sid{font-weight:700; background:var(--chip); border-radius:6px; padding:2px 8px; font-size:12px}
.tag{font-size:11px; color:var(--muted); background:var(--chip); border-radius:5px; padding:1px 6px}
.shot-motion{flex:1; min-width:160px; color:var(--muted); font-size:12px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.shotbody{padding:12px}
.shotbody .grid2,.shotbody .grid3{margin-top:10px}

/* ---------- tabs / tables ---------- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; font-family:inherit;
}
.tabs button:hover{border-color:var(--accent)}
.tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff}
.tabs .count{opacity:.7; font-size:11.5px}
.tablewrap{overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:700px}
th,td{padding:9px 10px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line2)}
th{font-size:11.5px; color:var(--muted); font-weight:650; background:#f8fafc; white-space:nowrap}
tr:last-child td{border-bottom:0}
td textarea{min-height:64px}
td .btn{margin-top:2px}

/* ---------- paths / publish ---------- */
.paths{display:grid; grid-template-columns:112px minmax(0,1fr); gap:7px 12px; font-size:13px}
.paths .k{color:var(--muted)}
.paths code{background:var(--chip); border-radius:5px; padding:2px 6px; user-select:all; word-break:break-all}
.summary-table{width:100%; border-collapse:collapse; font-size:13px; min-width:0}
.summary-table th,.summary-table td{border-bottom:1px solid var(--line2); padding:7px 8px}
.summary-table th{background:transparent}
pre.errbox{
  white-space:pre-wrap; word-break:break-word; background:var(--danger-soft);
  border:1px solid var(--danger-line); color:var(--danger); border-radius:8px;
  padding:10px 12px; font-size:12px; max-height:320px; overflow:auto; margin:10px 0 0;
}
pre.okbox{
  white-space:pre-wrap; word-break:break-word; background:var(--ok-soft);
  border:1px solid var(--ok-line); color:var(--ok); border-radius:8px;
  padding:10px 12px; font-size:12px; margin:10px 0 0;
}

/* ---------- pipeline ---------- */
.log{
  background:#0f172a; color:#dbeafe; border-radius:10px; padding:12px;
  font-family:ui-monospace,Consolas,Menlo,monospace; font-size:12px; line-height:1.5;
  white-space:pre-wrap; max-height:420px; overflow:auto; margin-top:12px;
  min-height:58px;
}
.log:empty::before{content:"运行日志会显示在这里…"; color:#7c8ba1}
.log .ln{min-height:1.3em}
.log .warn{color:#fbbf24} .log .fix{color:#4ade80}
.log .ok{color:#4ade80; font-weight:600} .log .err{color:#f87171}
.nowline{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:1.4em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- relations ---------- */
.relwrap{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; overflow:auto}

/* ---------- trace ---------- */
.trbar{font-size:12.5px; color:var(--muted); margin-bottom:10px; line-height:1.7}
.trcard{border:1px solid var(--line); border-radius:8px; margin-bottom:6px; overflow:hidden; background:var(--surface)}
.trcard.trfail{border-color:var(--danger-line); background:var(--danger-soft)}
.trsum{display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer; font-size:12.5px; flex-wrap:wrap}
.trsum:hover{background:#f5f7fb}
.trstat{font-weight:700; width:18px; text-align:center}
.trcard.ok .trstat{color:var(--ok)} .trcard.trfail .trstat{color:var(--danger)}
.trstage{font-weight:600; min-width:120px}
.tratt{color:var(--muted)} .trt{color:#98a2b3; font-family:ui-monospace,Consolas,monospace}
.trsec{color:#344054; background:var(--chip); border-radius:6px; padding:1px 7px}
.trmodel{color:#344054; background:#eef4ff; border:1px solid #dbe7ff; border-radius:6px;
  padding:1px 7px; font-family:ui-monospace,Consolas,monospace; font-size:11.5px}
.trtok{color:var(--muted); font-family:ui-monospace,Consolas,monospace; font-size:12px}
.trcost{color:#475467; font-family:ui-monospace,Consolas,monospace; font-size:11.5px}
.trerr{color:var(--danger); flex:1; min-width:120px}
.trbody{display:none; padding:0 10px 10px; border-top:1px dashed var(--line)}
.trcard.open .trbody{display:block}
.trblk{margin-top:8px}
.trblk b{font-size:11.5px; color:var(--muted); display:block; margin-bottom:3px}
.trblk pre{margin:0; white-space:pre-wrap; word-break:break-word; background:#f7f8fa;
  border:1px solid var(--line); border-radius:6px; padding:7px 9px; font-size:11.5px;
  max-height:280px; overflow:auto}
.trblk.trerrbox pre{background:var(--danger-soft); border-color:var(--danger-line); color:var(--danger)}

/* ---------- publish bar / toasts ---------- */
.publishbar{
  position:fixed; left:216px; right:0; bottom:0; z-index:25;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:11px 22px; background:var(--warn-soft);
  border-top:1px solid var(--warn-line); box-shadow:0 -6px 20px rgba(16,24,40,.06);
}
.publishbar .pbtext{display:flex; align-items:center; gap:10px; min-width:0}
.publishbar .pbtext b{font-size:13px; white-space:nowrap}
.publishbar .pbmsg{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.publishbar .pbactions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
#toasts{position:fixed; top:14px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:min(420px,90vw)}
.toast{
  padding:10px 14px; border-radius:8px; background:#fff; border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(16,24,40,.14); font-size:13px; line-height:1.5;
}
.toast.ok{border-left:4px solid var(--ok)}
.toast.err{border-left:4px solid var(--danger)}
.toast.out{opacity:0; transform:translateY(-4px); transition:.2s}

/* ---------- responsive ---------- */
@media(max-width:860px){
  .layout{display:block}
  nav{
    position:sticky; top:58px; z-index:20; height:auto;
    display:flex; align-items:center; gap:4px; overflow-x:auto;
    padding:7px 9px; border-right:0; border-bottom:1px solid var(--line);
  }
  .navsec{display:none}
  nav button{width:auto; white-space:nowrap; padding:7px 10px}
  main{padding:16px 14px 120px}
  .publishbar{left:0; padding:10px 14px}
  body.has-publish main{padding-bottom:150px}
  .hdr-right{width:100%; margin-left:0}
  .hdr-right .selwrap{flex:1}
  .hdr-right select{width:100%}
  .paths{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Manju Studio</h1>
    <span class="sub">小说 → 分镜契约</span>
  </div>
  <div class="hdr-right">
    <label class="selwrap" title="当前查看/编辑哪部小说的中间产物">小说
      <select id="novelSel" onchange="setNovel(this.value)"></select>
    </label>
    <span class="pill" id="modelPill">—</span>
    <span class="pill" id="statePill">—</span>
    <span class="pill" id="dirtyPill">—</span>
  </div>
</header>

<div class="layout">
<nav id="nav">
  <div class="navsec">流程</div>
  <button data-view="pipeline"><span class="step">1</span>生成</button>
  <button data-view="eps"><span class="step">2</span>分集 · 分镜</button>
  <button data-view="assets"><span class="step">3</span>角色 · 场景 · 道具</button>
  <button data-view="setup"><span class="step">4</span>画风 · 世界观</button>
  <button data-view="relations">人物关系</button>
  <div class="navsec">交付</div>
  <button data-view="publish">发布契约<span id="navDot" class="navdot" hidden></span></button>
  <div class="navsec">系统</div>
  <button data-view="config">配置</button>
  <button data-view="trace">LLM 日志</button>
</nav>
<main id="main"></main>
</div>

<footer id="publishBar" class="publishbar" hidden>
  <div class="pbtext">
    <span class="dot warn"></span>
    <b>有修改尚未发布</b>
    <span class="pbmsg" id="pbMsg"></span>
  </div>
  <div class="pbactions">
    <button class="btn ghost sm" data-go="publish">查看发布</button>
    <button class="btn sm" data-compile onclick="recompile()">重新编译契约</button>
  </div>
</footer>

<div id="toasts"></div>

<script>
/* =====================================================================
   Manju Studio 前端
   约定：
   - 修改只写中间产物 state/story/<小说>/；点「重新编译契约」才写 input/。
   - 生成页的「分集方式」决定改编成几集；「生成范围」只决定本次跑哪几集。
   ===================================================================== */
var state={view:'pipeline', ep:null, assetTab:'cast'};
var OVER={eps:[],ep_stats:[],dirty:{},llm:{},studio:{},generation:{},publish:{},current:{}};
var NOVEL='';
var LAST_COMPILE=null;
var pipeTimer=null, pipeLast=0, pipeFinished=false;

function $(id){return document.getElementById(id);}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function toast(txt,cls){
  var box=$('toasts'); if(!box)return;
  var d=document.createElement('div');
  d.className='toast '+(cls||'ok'); d.textContent=txt;
  box.appendChild(d);
  setTimeout(function(){d.classList.add('out');setTimeout(function(){d.remove();},220);},3400);
}
async function api(method,url,body){
  var opt={method:method,headers:{'Content-Type':'application/json'}};
  if(body)opt.body=JSON.stringify(body);
  var r=await fetch(url,opt);
  var j=await r.json();
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}

/* ---------------- 全局刷新 ---------------- */
async function refresh(){
  OVER=await api('GET','/api/overview');
  var l=OVER.llm||{};
  $('modelPill').textContent=(l.model||'未配置模型')+(l.provider?(' · '+l.provider):'');
  $('modelPill').className='pill'+(l.api_key?'':' err');
  var c=OVER.current||{};
  NOVEL=c.novel||'';
  $('statePill').textContent=c.novel?((c.phase==='work'?'工作层':'已固化')+' · '+c.novel):'未选小说';
  $('statePill').title=c.dir||'';
  var d=OVER.dirty||{};
  $('dirtyPill').textContent=d.dirty?'待发布':'已发布';
  $('dirtyPill').className='pill '+(d.dirty?'warn':'ok');
  $('dirtyPill').title=d.msg||'';
  updatePublishBar(d);
  var nv=await api('GET','/api/pipeline/novels');
  var opts='<option value="">全部（平铺）</option>'+nv.novels.map(function(n){
    var nm=n.name.replace(/\.txt$/,'');
    return '<option value="'+esc(nm)+'">'+esc(nm)+'</option>';
  }).join('');
  if(NOVEL&&!nv.novels.some(function(n){return n.name.replace(/\.txt$/,'')===NOVEL;}))
    opts='<option value="'+esc(NOVEL)+'">'+esc(NOVEL)+'（仅中间产物）</option>'+opts;
  $('novelSel').innerHTML=opts;
  $('novelSel').value=NOVEL;
}

function updatePublishBar(d){
  d=d||OVER.dirty||{};
  var bar=$('publishBar'), dot=$('navDot');
  if(d.dirty){
    $('pbMsg').textContent=d.msg||'修改已保存在中间产物，尚未写入 input/ 契约';
    bar.hidden=false;
    dot.hidden=false;
    document.body.classList.add('has-publish');
  }else{
    bar.hidden=true;
    dot.hidden=true;
    document.body.classList.remove('has-publish');
  }
}

/* ---------------- 导航 ---------------- */
function go(view){
  state.view=view;
  try{localStorage.setItem('manju.view',view);}catch(e){}
  document.querySelectorAll('#nav button').forEach(function(x){
    x.classList.toggle('active',x.dataset.view===view);
  });
  var p;
  try{
    if(view==='pipeline')p=renderPipeline();

    };

    await api('PUT','/api/config',b);

function syncMode(){
  var m=$('p_mode').value;
  $('p_eps_wrap').hidden=(m!=='fixed');
  $('p_chep_wrap').hidden=(m!=='chapters');
  var help={
    auto:'程序先读全文，按情节原子/戏剧单元自动决定集数；每集字数不参与。',
    fixed:'按指定集数拆分，适合你明确知道要出几集的情况。',
    chapters:'按小说章节切分，每 N 章一集；适合章节节奏本身就很完整的作品。'
  };
  $('p_mode_help').textContent=help[m]||'';
  updateRangeHint();
}
window.syncMode=syncMode;

function updateRangeHint(){
  var f=($('p_from').value||'').trim();
  var t=($('p_to').value||'').trim();
  var txt;
  if(!f&&!t)txt='本次：全部集数';
  else txt='本次：第 '+(f||'1')+' – '+(t||'末')+' 集';
  $('p_summary').textContent=txt+'（只影响本次运行，不改变总集数）';
}

function appendLog(lines){
  var lg=$('pipeLog'); if(!lg)return;
  lg.insertAdjacentHTML('beforeend',lines.map(function(x){
    var cls='ln';
    if(/\[WARN\]/.test(x))cls+=' warn';
    else if(/\[FIX\]/.test(x))cls+=' fix';
    else if(/\[err\]|✗|未通过|失败|退出码/.test(x))cls+=' err';
    else if(/通过质量门|已固化|已完成/.test(x))cls+=' ok';
    return '<div class="'+cls+'">'+(esc(x)||' ')+'</div>';
  }).join(''));
  lg.scrollTop=lg.scrollHeight;
}

function renderPipeStatus(s){
  var stg=$('pipeStage'); if(!stg)return;
  if(!s.running&&!s.done){stg.innerHTML='';return;}
  var dot=s.running?'<span class="dot run"></span>'
    :(s.done?(s.ok?'<span class="dot ok"></span>':'<span class="dot err"></span>'):'<span class="dot"></span>');
  var label=s.running?'运行中':(s.done?(s.ok?'已完成':'失败'):'空闲');
  var cls=s.running?'':(s.done?(s.ok?'ok':'err'):'');
  var head='<div class="statusline '+cls+'">'+dot+'<b>'+label+'</b>'
    +'<span class="muted">'+esc(s.story||'')+'</span></div>';
  if(s.running){
    var last=(s.lines&&s.lines.length)?s.lines[s.lines.length-1]:'';
    head+='<div class="nowline">'+esc(last)+'</div>';
  }
  if(s.done&&!s.ok){
    head+='<div class="callout err">'+esc(s.error||'未通过质量门或模型不可用')+'</div>'
      +'<p class="help">默认续跑：直接点「开始生成」会复用已完成的阶段。'
      +'若怀疑临时文件损坏，展开「高级选项」勾选「先清临时工作层再重跑」。</p>'
      +'<div class="actions"><button class="btn" onclick="startPipe()">续跑</button></div>';
  }
  if(s.done&&s.ok){
    head+='<div class="callout">上游已完成。产物已写入下列目录，可继续审阅或发布。</div>';
    if(s.out||s.work){
      head+='<div class="paths">'
        +(s.out?'<span class="k">编译产物</span><code>'+esc(s.out)+'</code>':'')
        +(s.work?'<span class="k">中间/可编辑</span><code>'+esc(s.work)+'</code>':'')
        +'</div>';
    }
    head+='<div class="actions">'
      +'<button class="btn" data-go="eps">审阅分集分镜</button>'
      +'<button class="btn ghost" data-go="publish">发布契约</button>'
      +'<button class="btn ghost" onclick="startPipe()">再跑一次</button>'
      +'</div>';
  }
  stg.innerHTML=head;
}

function pollPipe(){
  if(pipeTimer)return;
  pipeTimer=setInterval(async function(){
    try{
      var s=await api('GET','/api/pipeline/status');
      if($('pipeLog')&&s.lines.length>pipeLast){
        appendLog(s.lines.slice(pipeLast));pipeLast=s.lines.length;
      }
      renderPipeStatus(s);
      var b=$('p_start');
      if(b){
        b.disabled=!!s.running;
        b.textContent=s.running?'生成中…':'开始生成';
      }
      if(!s.running){
        clearInterval(pipeTimer);pipeTimer=null;
        if(s.done&&!pipeFinished){pipeFinished=true;refresh();}
      }
    }catch(e){}
  },1000);
}

window.startPipe=async function(){
  try{
    var story=$('p_story').value;
    if(!story){toast('请选择小说','err');return;}
    var mode=$('p_mode').value;
    var opts={ratio:$('p_ratio').value,duration:parseFloat($('p_dur').value)||90};
    var episodes='auto', chapters=0;
    if(mode==='fixed'){
      var n=parseInt($('p_eps').value,10);
      if(!(n>=1)){toast('总集数必须 ≥ 1','err');return;}
      episodes=n;
    }else if(mode==='chapters'){
      var c=parseInt($('p_chep').value,10);
      if(!(c>=1)){toast('每几章一集必须 ≥ 1','err');return;}
      chapters=c;
    }
    opts.episodes=episodes;
    // 显式传 0：覆盖 config 里可能残留的章节默认值，保证「按剧情自动」生效。
    opts.chapters_per_episode=chapters;
    var f=parseInt($('p_from').value,10);
    var t=parseInt($('p_to').value,10);
    if(f&&t&&t<f){toast('结束集不能小于起始集','err');return;}
    if(f)opts.from=f;
    if(t)opts.to=t;
    var cb=$('p_clean');
    if(cb&&cb.checked)opts.clean=true;
    var r=await api('POST','/api/pipeline/run',{story:story,opts:opts});
    if(!r.ok){toast(r.msg,'err');return;}
    pipeLast=0;pipeFinished=false;
    var lg=$('pipeLog');if(lg)lg.innerHTML='';
    var stg=$('pipeStage');if(stg)stg.innerHTML='';
    var b=$('p_start');if(b){b.disabled=true;b.textContent='生成中…';}
    toast(r.msg);
    if(!pipeTimer)pollPipe();
    await refresh();
  }catch(e){toast('启动失败：'+e.message,'err');}
};

async function openEp(ep){
  state.ep=ep;
  var d;
  try{d=await api('GET','/api/ep/'+ep);}catch(e){toast('读取失败：'+e.message,'err');return;}
  var rows=OVER.ep_stats||[];
  var idx=rows.findIndex(function(r){return r.ep===ep;});
  var prev=idx>0?rows[idx-1].ep:null;
  var next=idx>=0&&idx<rows.length-1?rows[idx+1].ep:null;
  var groups={};
  d.cuts.forEach(function(c){var k=String(c.scene);(groups[k]=groups[k]||[]).push(c);});
  var keys=Object.keys(groups).sort(function(a,b){return Number(a)-Number(b);});
  var body='';
  if(!keys.length){
    body='<div class="empty"><b>这一集没有镜头</b>检查 board_ep'+String(ep).padStart(2,'0')+'.json 是否完整。</div>';
  }
  keys.forEach(function(sc){
    var cuts=groups[sc];
    body+='<section class="scene"><div class="scenehead"><h3>场景 '+esc(sc)+'</h3>'
      +'<span class="help">'+cuts.length+' 镜</span></div>';
    cuts.forEach(function(c){body+=shotCard(c);});
    body+='</section>';
  });
  $('main').innerHTML=
    '<div class="pagehead">'
    +'<button class="linkbtn" onclick="renderEps()">← 返回分集</button>'
    +'<h2 style="margin-top:6px">EP '+String(ep).padStart(2,'0')+' · '+esc(d.title||'未命名')+'</h2>'
    +'<p class="help">'+esc(d.synopsis||'')+'</p>'
    +'<p class="help">'+d.scene_count+' 场 · '+d.cuts.length+' 镜 · '+d.seconds+'s</p>'
    +'</div>'
    +'<div class="actions tight" style="margin-bottom:14px">'
    +(prev?'<button class="btn ghost sm" data-open="'+prev+'">← EP'+String(prev).padStart(2,'0')+'</button>':'')
    +(next?'<button class="btn ghost sm" data-open="'+next+'">EP'+String(next).padStart(2,'0')+' →</button>':'')
    +'<button class="btn ghost sm" onclick="toggleShots(true)">全部展开</button>'
    +'<button class="btn ghost sm" onclick="toggleShots(false)">全部收起</button>'
    +'</div>'
    +body
    +'<div class="callout">改完镜头先点该镜的「保存该镜」，再点底部「重新编译契约」发布。</div>';
  window.scrollTo(0,0);
}
window.openEp=openEp;

function dd2lines(dd){
  if(Array.isArray(dd))return dd.filter(Boolean).join('\n');
  if(dd&&typeof dd==='object'){
    var good=Array.isArray(dd.DO)?dd.DO:(Array.isArray(dd.do)?dd.do:[]);
    var bad=Array.isArray(dd["DON'T"])?dd["DON'T"]:(Array.isArray(dd.DONT)?dd.DONT:(Array.isArray(dd.dont)?dd.dont:[]));
    bad=bad.map(function(x){var t=String(x);return /^(不要|不准|禁止|切勿|别|忌|No |Don't|Avoid)/.test(t)?t:('忌：'+t);});
    return good.concat(bad).filter(Boolean).join('\n');
  }
  return '';
}
async function saveSetup(){
  try{
    function L(v){return v.split(',').map(function(x){return x.trim();}).filter(Boolean);}
    function J(id,name){
      var raw=$(id).value.trim();
      if(!raw)return [];
      try{var arr=JSON.parse(raw);if(!Array.isArray(arr))throw 0;return arr;}
      catch(e){throw new Error(name+' 不是合法 JSON 数组');}
    }
    var vb={
      style_keywords:L($('s_style').value),
      main_colors:L($('s_colors').value),
      reference_styles:L($('s_ref').value),
      do_dont:$('s_dd').value.split('\n').map(function(x){return x.trim();}).filter(Boolean)
    };
    [['medium','v_medium'],['film_stock','v_stock'],['lens','v_lens'],['lighting','v_light'],
     ['palette','v_pal'],['texture','v_tex'],['contrast','v_con']].forEach(function(p){
      var v=$(p[1]).value.trim();if(v)vb[p[0]]=v;
    });
    var w={factions:J('w_f','factions'),geography:J('w_g','geography'),
      timeline:J('w_t','timeline'),rules:J('w_r','rules')};
    await api('PUT','/api/setup',{visual_bible:vb,world:w});
    await refresh();
    toast('画风与世界观已保存（待发布）');
  }catch(e){toast('保存失败：'+e.message,'err');}
}
window.saveSetup=saveSetup;

async function renderRelations(){
  var d;
  try{d=await api('GET','/api/cast/relations');}catch(e){
    $('main').innerHTML='<div class="pagehead"><h2>人物关系</h2></div>'
      +'<div class="empty"><b>还没有角色数据</b>先到「生成」页生成一部小说。</div>';
    return;
  }
  var chars=d.characters||[];
  if(!chars.length){
    $('main').innerHTML='<div class="pagehead"><h2>人物关系</h2></div>'
      +'<div class="empty"><b>还没有角色数据</b></div>';
    return;
  }
  var byId={};
  chars.forEach(function(c,i){byId[c.id]=i;});
  var W=820,H=560,cx=W/2,cy=H/2,r=200,n=chars.length;
  var pos=chars.map(function(_,i){var a=-Math.PI/2+2*Math.PI*i/n;
    return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});
  var colors=['#2f5d8a','#0f766e','#b45309','#7c3aed','#b91c1c','#0e7490','#4d7c0f','#be185d','#7f1d1d','#1d4ed8'];
  var relTypes={};
  chars.forEach(function(c){c.relationships.forEach(function(rel){var k=rel.type||'关联';relTypes[k]=(relTypes[k]||0)+1;});});
  var typeColor={};
  Object.keys(relTypes).forEach(function(k,i){typeColor[k]=colors[i%colors.length];});
  var g='<div class="pagehead"><h2>人物关系</h2>'
    +'<p class="help">关系来自 cast.persona.relationship_spec；连线颜色=关系类型，悬停可看备注。</p></div>'
    +'<div class="relwrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="max-width:100%;height:auto">';
  chars.forEach(function(c,si){c.relationships.forEach(function(rel){
    var ti=byId[rel.target];if(ti==null)return;
    var p=pos[si],q=pos[ti];var col=typeColor[rel.type||'关联']||'#888';
    g+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'" stroke="'+col+'" stroke-width="1.5" opacity="0.7">'
      +'<title>'+esc(c.name)+' → '+esc(rel.target)+'：'+esc(rel.type)+'　'+esc(rel.note)+'</title></line>';
    var mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
    g+='<text x="'+mx+'" y="'+my+'" font-size="10" fill="'+col+'" text-anchor="middle">'+esc(rel.type)+'</text>';
  });});
  chars.forEach(function(c,si){var p=pos[si];
    g+='<circle cx="'+p.x+'" cy="'+p.y+'" r="26" fill="#fff" stroke="'+colors[si%colors.length]+'" stroke-width="2"></circle>'
      +'<text x="'+p.x+'" y="'+p.y+'" text-anchor="middle" font-size="11" fill="#17202a" dominant-baseline="central">'+esc(c.name)+'</text>';
  });
  g+='</svg></div><div class="actions">';
  Object.keys(typeColor).forEach(function(k){
    g+='<span class="tag" style="color:'+typeColor[k]+';border:1px solid '+typeColor[k]+'">'+esc(k)+'</span>';
  });
  g+='</div>';
  var loose=[];
  chars.forEach(function(c){c.relationships.forEach(function(rel){
    if(byId[rel.target]==null)loose.push(c.name+' → '+rel.target+'（'+rel.type+'）');
  });});
  if(loose.length){
    g+='<h3 style="font-size:13px;margin-top:18px">未在图中的关系</h3>'
      +'<p class="help">'+loose.map(esc).join('；')+'</p>';
  }
  $('main').innerHTML=g;
}

async function recompile(){

  try{
    var r=await api('POST','/api/compile');

      warnings:r.warnings,repairs:r.repairs||[],t:new Date().toLocaleString()};
    toast('已发布：'+r.written+' 个文件 / '+r.eps.length+' 集');
    await refresh();

    +' · 点击任意一条可展开提示词 / 输入 / 模型输出';
  if(!es.length){$('trList').innerHTML='<p class="trbar">暂无 LLM 调用记录（跑一次生成后出现）。</p>';return;}
  $('trList').innerHTML=es.map(function(e){
    var ok=e.ok!==false;
    var model=e.model
      ? '<span class="trmodel" title="'+(e.model_inferred?'旧记录未写模型，按当前配置推断':'本次请求模型')+'">'
        +esc(e.model)+(e.model_inferred?'*':'')+'</span>'
      : '';
    var hasTokens=(Number(e.in_tokens||0)+Number(e.out_tokens||0))>0;
    var costHtml=(hasTokens&&e.cost_offpeak_cny!=null&&e.cost_peak_cny!=null)
      ? '<span class="trcost" title="官方价估算：空闲–高峰">≈¥'+fmtCny(e.cost_offpeak_cny)
        +'–'+fmtCny(e.cost_peak_cny)+'</span>'
      : '';
    return '<div class="trcard '+(ok?'ok':'trfail')+'">'
      +'<div class="trsum" onclick="this.parentNode.classList.toggle(\'open\')">'
      +'<span class="trstat">'+(ok?'OK':'×')+'</span>'
      +'<span class="trstage">'+esc(e.stage||'')+'</span>'
      +model
      +'<span class="tratt">第'+((e.attempt||0)+1)+'次</span>'
      +'<span class="trt">'+esc(e.t||'')+'</span>'
      +(e.secs!=null?'<span class="trsec">'+e.secs+'s</span>':'')
      +'<span class="trtok">'+(e.in_tokens||0)+' → '+(e.out_tokens||0)+' tok</span>'
      +costHtml
      +(ok?'':'<span class="trerr">'+esc(e.error||'输出不符合 Schema')+'</span>')
      +'</div><div class="trbody">'
      +trBlock('错误',e.error,'trerrbox')
      +trBlock('模型（本次请求）',e.model
        ? e.model+(e.model_inferred?'（旧记录，按当前配置推断）':'') : '')
      +trBlock('费用估算（CNY）',(hasTokens&&e.cost_offpeak_cny!=null&&e.cost_peak_cny!=null)
        ? '空闲 '+fmtCny(e.cost_offpeak_cny)+' / 高峰 '+fmtCny(e.cost_peak_cny) : '')
      +trBlock('System（系统提示词，前400字）',e.system)
      +trBlock('User（输入，前600字）',e.user)
      +trBlock('Output（模型输出，前6000字）',e.output)
      +'</div></div>';
  }).join('');
}
function fmtInt(n){
  n=Number(n||0);
  return isFinite(n)?n.toLocaleString('en-US'):'0';
}
function fmtCny(n){
  n=Number(n||0);
  if(!isFinite(n))n=0;
  var d=n>=1?3:(n>=0.01?4:6);
  return n.toFixed(d).replace(/\.?0+$/,'');
}
function trBlock(label,text,cls){
  if(!text)return '';
  return '<div class="trblk'+(cls?' '+cls:'')+'"><b>'+label+'</b><pre>'+esc(text)+'</pre></div>';
}

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-go]');
  if(b){go(b.dataset.go);return;}
  b=e.target.closest('[data-ep]');
  if(b){openEp(parseInt(b.dataset.ep,10));return;}
  b=e.target.closest('[data-open]');
  if(b){openEp(parseInt(b.dataset.open,10));return;}
  b=e.target.closest('[data-tab]');
  if(b){state.assetTab=b.dataset.tab;renderAssets();return;}
  b=e.target.closest('[data-shot]');
  if(b){saveShot(parseInt(b.dataset.shot,10));return;}
  b=e.target.closest('[data-save]');
  if(b){saveAsset(b.dataset.save,b.dataset.id,b);return;}
});
$('nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  go(b.dataset.view);
});

/* ---------------- 启动 ---------------- */
var startView='pipeline', startEp=null, startOpen=false;
try{
  var qs=new URLSearchParams(location.search);
  startView=qs.get('view')||localStorage.getItem('manju.view')||'pipeline';
  startEp=parseInt(qs.get('ep'),10)||null;
  startOpen=qs.get('open')==='1';
}catch(e){}
refresh().then(function(){
  go(startView);
  if(startView==='eps'&&startEp){
    openEp(startEp).then(function(){if(startOpen)toggleShots(true);});
  }
}).catch(function(e){
  $('main').innerHTML='<div class="empty"><b>读取配置失败</b>'+esc(e.message)+'</div>';
});
</script>
</body>
